<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" id="theme-color-meta" content="#000000">
  <title>Friday OS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    :root[data-theme="dark"] {
      --bg-gradient: radial-gradient(circle at 50% 30%, #1e293b, #0f172a, #020617);
      --text-color: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.6);
      --text-tertiary: rgba(255, 255, 255, 0.5);
      --icon-bg: rgba(255, 255, 255, 0.2);
      --icon-border: rgba(255, 255, 255, 0.3);
      --window-bg: #000000;
      --header-bg: rgba(30, 30, 30, 0.85);
      --header-border: rgba(255, 255, 255, 0.1);
      --blue-accent: #0a84ff;
      --card-bg: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.12);
      --divider: rgba(255, 255, 255, 0.08);
      --input-bg: rgba(0, 0, 0, 0.3);
    }
    :root[data-theme="light"] {
      --bg-gradient: linear-gradient(180deg, #e2e8f0, #f1f5f9, #ffffff);
      --text-color: #000000;
      --text-secondary: rgba(0, 0, 0, 0.5);
      --text-tertiary: rgba(0, 0, 0, 0.4);
      --icon-bg: rgba(255, 255, 255, 0.6);
      --icon-border: rgba(0, 0, 0, 0.1);
      --window-bg: #f2f2f7;
      --header-bg: rgba(255, 255, 255, 0.85);
      --header-border: rgba(0, 0, 0, 0.1);
      --blue-accent: #007aff;
      --card-bg: #ffffff;
      --card-border: rgba(0, 0, 0, 0.08);
      --divider: rgba(0, 0, 0, 0.08);
      --input-bg: rgba(0, 0, 0, 0.05);
    }

    body {
      background: var(--bg-gradient);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
      height: 100vh; overflow: hidden; display: flex; flex-direction: column;
      justify-content: space-between; padding: 60px 20px 50px 20px;
      color: var(--text-color); transition: background 0.3s, color 0.3s;
    }

    .time-widget { text-align: center; margin-top: 25px; text-shadow: 0 4px 20px rgba(0,0,0,0.15); }
    .time-widget .clock { font-size: 78px; font-weight: 200; letter-spacing: -2px; line-height: 1; }
    .time-widget .date { font-size: 18px; font-weight: 500; margin-top: 10px; opacity: 0.85; letter-spacing: 0.5px; }

    .app-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 28px 18px; width: 100%; margin-bottom: 25px; }
    .app-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
    .app-icon {
      width: 68px; height: 68px; border-radius: 18px; background: var(--icon-bg);
      backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
      display: flex; justify-content: center; align-items: center; font-size: 32px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15); border: 1px solid var(--icon-border);
      transition: transform 0.15s ease, background 0.3s, border 0.3s;
    }
    .app-item:active .app-icon { transform: scale(0.88); }
    .app-name { font-size: 13px; font-weight: 500; margin-top: 8px; text-shadow: 0 2px 6px rgba(0,0,0,0.2); text-align: center; white-space: nowrap; }

    .app-window {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: var(--window-bg); z-index: 100; display: flex; flex-direction: column;
      transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1), background 0.3s;
    }
    .app-window.active { transform: translateY(0); }
    .window-header {
      height: 50px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between;
      background: var(--header-bg); border-bottom: 1px solid var(--header-border);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      transition: background 0.3s, border-bottom 0.3s;
    }
    .window-title { font-size: 17px; font-weight: 600; color: var(--text-color); }
    .close-btn { font-size: 15px; color: var(--blue-accent); cursor: pointer; font-weight: 500; transition: color 0.3s; }
    .window-body { flex: 1; padding: 16px; overflow-y: auto; color: var(--text-color); }
  </style>
</head>
<body>
  <div class="time-widget">
    <div class="clock" id="clock">--:--</div>
    <div class="date" id="date">--月--日 星期-</div>
  </div>
  <div class="app-grid">
    <div class="app-item" onclick="openApp('settings', '设置')"><div class="app-icon">⚙️</div><div class="app-name">设置</div></div>
    <div class="app-item" onclick="openApp('theme', '美化')"><div class="app-icon">🎨</div><div class="app-name">美化</div></div>
    <div class="app-item" onclick="openApp('relationship', '关系网')"><div class="app-icon">🌐</div><div class="app-name">关系网</div></div>
    <div class="app-item" onclick="openApp('bookshelf', '书架')"><div class="app-icon">📚</div><div class="app-name">书架</div></div>
    <div class="app-item" onclick="openApp('muyu', '木鱼')"><div class="app-icon">🪵</div><div class="app-name">木鱼</div></div>
    <div class="app-item" onclick="openApp('trash', '垃圾桶')"><div class="app-icon">🗑️</div><div class="app-name">垃圾桶</div></div>
    <div class="app-item" onclick="openApp('diary', '日记')"><div class="app-icon">📖</div><div class="app-name">日记</div></div>
    <div class="app-item" onclick="openApp('notes', '笔记')"><div class="app-icon">📝</div><div class="app-name">笔记</div></div>
  </div>
  <div class="app-window" id="appWindow">
    <div class="window-header">
      <span class="window-title" id="windowTitle">应用</span>
      <span class="close-btn" onclick="closeApp()">完成</span>
    </div>
    <div class="window-body" id="windowBody"></div>
  </div>

  <script>
    function initTheme() {
      const savedTheme = localStorage.getItem('friday_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      const meta = document.getElementById('theme-color-meta');
      if (meta) meta.content = savedTheme === 'dark' ? '#000000' : '#f2f2f7';
    }
    initTheme();

    function updateTime() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clock').innerText = `${hours}:${minutes}`;
      const options = { month: 'long', day: 'numeric', weekday: 'long' };
      document.getElementById('date').innerText = now.toLocaleDateString('zh-CN', options);
    }
    setInterval(updateTime, 1000);
    updateTime();

    async function openApp(appId, title) {
      document.getElementById('windowTitle').innerText = title;
      const body = document.getElementById('windowBody');
      body.innerHTML = '';
      // 核心修复：彻底清除上一个应用(如settings)留下的内联样式霸权
      body.removeAttribute('style');
      
      try {
        const module = await import(`./src/apps/${appId}/index.js`);
        if (module && module.render) {
          module.render(body);
        }
      } catch (e) {
        console.error(e);
        body.innerHTML = `<div style="padding:20px; color:var(--text-secondary); text-align:center; margin-top:50px;">${title} 应用正在开发中...</div>`;
      }
      document.getElementById('appWindow').classList.add('active');
    }

    function closeApp() {
      document.getElementById('appWindow').classList.remove('active');
    }
  </script>
</body>
</html>
